# File: azure-pipelines.yml
trigger:
  - main

variables:
  vmImageName: 'ubuntu-latest'

stages:
  # STAGE 1: Automated Quality & Constraint Validation (CI)
  - stage: CI_Validation
    displayName: 'Continuous Integration Guardrails'
    jobs:
      - job: RunTests
        displayName: 'Execute Financial Guardrail Tests'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
            displayName: 'Provision Python Environment'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install Platform Dependencies'

          - script: |
              pytest test_agents.py --junitxml=junit/test-results.xml
            displayName: 'Run PyTest Quality Gateways'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
            displayName: 'Upload Test Reports to Dashboard'
